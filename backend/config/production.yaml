# SimulManager 운영 설정 — 실 배포 (시뮬매니저 PC 192.168.0.10)
# 프로토콜맵 v0.9 기준. 링크①·③ 뱅크 구분 방식은 협의 중 (docs/OPEN_ISSUES.md #1)

network:
  bind: 0.0.0.0
  web_port: 8100
  mode: single_port      # 단일 포트 502, 클라이언트 IP로 뱅크 라우팅
  port: 502
  link1_port: 5020
  link3_port: 5021
  ems_ip: 192.168.0.20
  rtds_ip: 192.168.0.30
  unit_id: 1

simulation:
  start_virtual_time: "2025-07-01T00:00"
  days: 30
  accel_seconds_per_15min: 10
  initial_soc: 50.0
  soc_max: 90.0
  soc_min: 10.0
  charge_limit_kw: 250.0
  discharge_limit_kw: 250.0

timing:
  response_timeout_ms: 1000
  retry_count: 3
  reconnect_interval_s: [1, 5]
  heartbeat_period_s: 1
  alive_timeout_s: 3
  disconnect_budget_intervals: 14

scenario:
  interpolation: hold
  data_dir: ../data

historian:
  db_path: ../data/historian.db
