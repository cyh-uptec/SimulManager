[project]
name = "simul-manager"
version = "0.1.0"
description = "EMS-RTDS HILS 시뮬레이션 매니저 — 가상시계·시나리오 배포·Historian·생존감시·연결중개"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymodbus>=3.8,<3.9",  # 3.9+는 datastore deprecated(v4 전환기) — v4 안정화 시 마이그레이션
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: 에뮬레이터 통합 등 장시간 테스트 (-m 'not slow'로 제외 가능)"]
